<script>

const SH=[['Ball',(x,y)=>x*x+y*y<=1],

 for(let i=0;i<n*n;i++)if(m[i])ord.push([Math.hypot(i%n-n/2,(i/n|0)-n/2)+r()*NWv,i]);
 ord.sort((a,b)=>a[0]-b[0]);

 for(const mx of[ml,Math.max(3,ml>>1),2])for(const[,s]of ord){

   const p=[s],tl=Math.max(2,mx>>1)+(r()*(mx-(mx>>1)+1)|0);o[s]=id;let ld=-1;
   while(p.length<tl){const e=p[p.length-1],ex=e%n,ey=e/n|0,op=[];
    for(let k=0;k<4;k++){const x=ex+D[k][0],y=ey+D[k][1];if(x>=0&&y>=0&&x<n&&y<n&&m[y*n+x]&&o[y*n+x]<0)op.push(k)}
    if(!op.length)break;

   for(const P of[p,p.slice().reverse()]){for(const q of P)o[q]=id;let be=0,bk=0,bl=-1e9;

    let pc=0;for(let i=e-1;i>=e-1-sg;i--){const q=P[i],qx=q%n,qy=q/n|0,dd=D[st];for(const sn of[1,-1]){const u=qx-dd[1]*sn,v=qy+dd[0]*sn;if(u>=0&&v>=0&&u<n&&v<n&&dC[v*n+u]==st)pc++}}
    const sc=ln+.2*e-DWv*dv-PWv*pc-.04*cn[st];if(sc>bl){bl=sc;be=e;bk=st}}
   for(const q of P)if(o[q]===id)o[q]=-1;
   if(be&&(!B||bl>B.l))B={p:P.slice(0,be),k:bk,l:bl}}}
  if(B){for(const q of B.p){o[q]=id;dC[q]=B.k}dA[B.p[B.p.length-1]]=B.k;cn[B.k]++;A.push({c:B.p,d:B.k})}}
 return{n,o,A,nm:sh[0],m}}
function score(G){const{n,A}=G,o=G.o.slice(),bk=a=>{const h=a.c[a.c.length-1],d=D[a.d];let x=h%n+d[0],y=(h/n|0)+d[1];while(x>=0&&y>=0&&x<n&&y<n){const v=o[y*n+x];if(v>=0)return v;x+=d[0];y+=d[1]}return-1};let al=A.map(()=>1),left=A.length,rd=0,f0=0,cl=0;A.forEach(a=>cl+=a.c.length);
 while(left){const fr=[];A.forEach((a,i)=>{if(al[i]&&bk(a)<0)fr.push(i)});if(!fr.length)return-1e9;if(!rd)f0=fr.length;fr.forEach(i=>{al[i]=0;A[i].c.forEach(q=>o[q]=-1);left--});rd++}
 return rd*10+(100-100*f0/A.length)*3+cl/A.length*1.5}
function gen(L){let b=null,bs=-1e9;for(let i=0;i<14;i++){const G=gen1(L,i*101),v=score(G);if(v>bs){bs=v;b=G}}return b}
let G,n,o,cs=20,lives,left,L=1,ov=0,cx,lt=0,dz=1,wb=0,cu=1;
const cv=$('c'),X=v=>(v+1)*cs;
const blk=a=>{const h=a.c[a.c.length-1],d=D[a.d];let x=h%n+d[0],y=(h/n|0)+d[1];while(x>=0&&y>=0&&x<n&&y<n){const v=o[y*n+x];if(v>=0)return v;x+=d[0];y+=d[1]}return-1};
function th(){const t=TH[S.th],s=document.documentElement.style;s.setProperty('--bg',t.bg);s.setProperty('--ln',t.ln);s.setProperty('--dr',t.dr)}

function show(t,b,f,h){$('ot').textContent=t;$('ob').textContent=b;$('stv').innerHTML=h&&h[0]||'';$('rw').innerHTML=h&&h[1]||'';$('ov').classList.toggle('w',!!h);$('ob').onclick=()=>{hide();f()};$('ov').style.display='flex';ov=1}

 for(const a of G.A){const k=a.c.length-1,d=D[a.d];a.s=0;a.v=8;
  let x=a.c[k]%n,y=a.c[k]/n|0,m=0;while(x>=0&&y>=0&&x<n&&y<n){x+=d[0];y+=d[1];m++}
  a.E=k+m+2;a.T=a.c.map(q=>[q%n+.5,(q/n|0)+.5]);const e=a.T[k];

 $('ttl').innerHTML='Level '+L+'<small>'+G.nm+'</small>';drops();hide();lay();if(mt&&mi!=(L-1)%TR.length)music()}

 show(tt,L<500?'Next level':'Levels',()=>L<500?start(L+1):go('levels'),['<div class=str><b>'+'★'.repeat(ns)+'</b>'+'★'.repeat(3-ns)+'</div>',[['Difficulty',L<50?'Easy':L<200?'Normal':L<400?'Hard':'Expert'],['Time',p2(ms/6e4|0)+':'+p2(ms/1e3%60|0)],['Score',G.A.length*10+lives*50],['Today’s Levels',S.tn]].map(r=>'<div class=sr><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')]);sfx('win');vib([30,40,30]);say(tt);conf()}
function sel(){const g=$('g');g.innerHTML='';for(let i=1;i<=500;i++){const b=document.createElement('button');b.textContent=i;b.className=i>S.u?'lk':i==L?'cur':'';b.onclick=()=>{if(i<=S.u){start(i);go('play')}};g.appendChild(b)}$('sel').style.display='flex'}
const pa=(T,t)=>{const i=Math.min(Math.floor(t),T.length-2),f=t-i;return[T[i][0]+(T[i+1][0]-T[i][0])*f,T[i][1]+(T[i+1][1]-T[i][1])*f]};

  for(const a of G.A){if(a.gone)continue;
   if(a.mv){a.p=Math.max(0,Math.min(1,(t-a.t0)/500));a.s=a.E*(.3*a.p+.7*a.p*a.p);if(a.p>=1){a.gone=1;a.mv=0;if(!--left){const g=G;setTimeout(()=>{if(g===G)win()},300)}continue}}
